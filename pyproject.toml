[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pjm_gats"
version = "0.0.1"
description = "PJM GATS integration for Home Assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4==4.13.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    "pytest-mock>=3.12",
    "syrupy>=4.0",
    "freezegun>=1.2",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["custom_components"]
exclude = [".mypy_cache", ".venv", "__pycache__", "build", "dist"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
]
ignore = [
    "SIM103",  # return_value vs return
    "TRY003",  # avoid specifying long messages outside exceptions
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["custom_components.pjm_gats"]

[tool.mypy]
python_version = "3.14"
strict = true
namespace_packages = true
exclude = [".venv", "build", "dist", ".mypy_cache"]
[tool.mypy.overrides]
module = "homeassistant.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components/pjm_gats"]
omit = ["tests/*", "custom_components/pjm_gats/__pycache__/*"]